{%extends "layout2.html"%}

{%load static%}
{%block content%}

<!-- BEGIN HEADER -->          
<!-- BEGIN WRAPPER -->

<div class="row">                    
    <!-- BEGIN BREADCRUMB -->
    <div class="col-md-12">
        <div class="breadcrumb-box border shadow"> 
            <ul class="breadcrumb">
                <li><a href="#">دوره ها</a></li>                                
                <li class="active">دوره ها</li>                            
            </ul>
        </div><!-- /.breadcrumb-box -->
    </div><!-- /.col-md-12 -->
    <!-- END BREADCRUMB -->                    

    <div class="col-md-12">
        <div class="portlet box border shadow">
            <div class="portlet-heading">
                <div class="portlet-title">
                    <h3 class="title">                                        
                        <i class="icon-frane"></i>
                        ویرایش سطح
                    </h3>
                </div><!-- /.portlet-title -->
                <div class="buttons-box">
                    <a class="btn btn-sm btn-default btn-round btn-code" rel="tooltip" title="کدها" href="#">
                        <i class="fa fa-code"></i>
                    </a>
                    <div class="code-modal hide">
                    </div>
                    <a class="btn btn-sm btn-default btn-round btn-fullscreen" rel="tooltip" title="تمام صفحه" href="#">
                        <i class="icon-size-fullscreen"></i>
                    </a>
                    <a class="btn btn-sm btn-default btn-round btn-collapse" rel="tooltip" title="کوچک کردن" href="#">
                        <i class="icon-arrow-up"></i>
                    </a>
                </div><!-- /.buttons-box -->
            </div><!-- /.portlet-heading -->
            <div class="portlet-body">
                <form method="POST" action="">
                    {%csrf_token%}
                    <div class="form-body">
                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-group row">
                                    <label class="col-sm-3">نام سطح</label>
                                    <div class="col-sm-6">
                                        <input type="text" class="form-control" name="title" id="title" required
                                        value="{{old.title}}">
                                    </div>
                                </div>
                                <div class="form-group row">
                                    <label class="col-sm-3">تعداد درس</label>
                                    <div class="col-sm-6">
                                        <input type="text" class="form-control" name="amount" id="amount"
                                        value="{{old.number}}">
                                    </div>
                                </div>
                                <div class="form-group row">
                                    <label class="col-sm-3">QUIZ1</label>
                                    <div class="col-sm-6">
                                        <input type="text" class="form-control" name="quiz1" id="quiz1" required
                                        value="{{old.quiz1}}">
                                    </div>
                                </div>
                                <div class="form-group row">
                                    <label class="col-sm-3">QUIZ2</label>
                                    <div class="col-sm-6">
                                        <input type="text" class="form-control" name="quiz2" id="quiz2" required
                                        value="{{old.quiz2}}">
                                    </div>
                                </div>
                                <div class="form-group row">
                                    <label class="col-sm-3">QUIZ3</label>
                                    <div class="col-sm-6">
                                        <input type="text" class="form-control" name="quiz3" id="quiz3" required
                                        value="{{old.quiz3}}">
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group row">
                                    <label class="col-sm-3">QUIZ4</label>
                                    <div class="col-sm-6">
                                        <input type="text" class="form-control" name="quiz4" id="quiz4" required
                                        value="{{old.quiz4}}">
                                    </div>
                                </div>
                                <div class="form-group row">
                                    <label class="col-sm-3">QUIZ5</label>
                                    <div class="col-sm-6">
                                        <input type="text" class="form-control" name="quiz5" id="quiz5" required
                                        value="{{old.quiz5}}">
                                    </div>
                                </div>
                                <div class="form-group row">
                                    <label class="col-sm-3">QUIZ6</label>
                                    <div class="col-sm-6">
                                        <input type="text" class="form-control" name="quiz6" id="quiz6" required
                                        value="{{old.quiz6}}">

                                    </div>
                                </div>
                                <div class="form-group row">
                                    <label class="col-sm-3">QUIZ7</label>
                                    <div class="col-sm-6">
                                        <input type="text" class="form-control" name="quiz7" id="quiz7" required
                                        value="{{old.quiz7}}">
                                    </div>
                                </div>
                                <div class="form-group row">
                                    <label class="col-sm-3">FINAL</label>
                                    <div class="col-sm-6">
                                        <input type="text" class="form-control" name="final" id="final" required
                                        value="{{old.final}}">
                                    </div>
                                </div>
                                <div class="form-actions">
                                    <button type="submit" class="btn btn-info btn-round">
                                        <i class="icon-check"></i>
                                        ذخیره
                                    </button>
                                    <a href="{% url "levellist" %}" class="btn btn-primary btn-warning round">
                                        <i class="icon-close"></i>
                                        بازگشت
                                    </a>
                                </div><!-- /.form-actions -->
                            </div>
                        </div>
                    </div>
                </form>
            </div><!-- /.portlet-body -->
        </div><!-- /.portlet -->
    </div><!-- /.col-md-12 -->     
           
</div><!-- /.row -->

<div class="row footer-container">
    <div class="col-md-12">
        <div class="copyright">
            <p class="pull-right">
                کلیه حقوق آموزشگاه زبان محفوظ می باشد و کپی برداری از آن به هیچ عنوان جایز نیست.
            </p>
            <p class="pull-left ltr tahoma">
                <span>©</span>
                <a href="http://ioplus.ir">ioplus</a>
            </p>
        </div><!-- /.copyright -->
    </div><!-- /.col-md-12 -->
</div><!-- /.row -->
<!-- BEGIN PAGE JAVASCRIPT -->
{%block scripts%}
<script src="{% static  "assets/plugins/data-table/js/jquery.dataTables.min.js"%}"></script>
<script src="{% static "assets/plugins/data-table/js/dataTables.bootstrap.js"%}"></script>
<script src="{% static  "assets/js/pages/datatable.js"%}"></script>
{%endblock%}
<!-- END PAGE JAVASCRIPT -->    
{%endblock%}
