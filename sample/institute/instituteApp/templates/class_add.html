{%extends "layout2.html" %}
{%load static%}

{%block extra_css%}
<link href="{% static "assets/plugins/select2/dist/css/select2.min.css"%}" rel="stylesheet">
{%endblock%}

{%block content%}
    <div class="row">                    
        <!-- BEGIN BREADCRUMB -->
        <div class="col-md-12">
            <div class="breadcrumb-box border shadow"> 
                <ul class="breadcrumb">
                    <li><a href="dashboard.html">آموزش</a></li>                                
                    <li class="active">تعریف کلاس</li>                            
                </ul>
            </div><!-- /.breadcrumb-box -->
        </div><!-- /.col-md-12 -->
        <!-- END BREADCRUMB -->                    
        
        <div class="col-md-6">
            <div class="portlet box border shadow">
                <div class="portlet-heading">
                    <div class="portlet-title">
                        <h3 class="title">                                        
                            <i class="icon-settings"></i>
                            فرم  کلاس
                        </h3>
                    </div><!-- /.portlet-title -->
                    <div class="buttons-box">
                        <a class="btn btn-sm btn-default btn-round btn-fullscreen" rel="tooltip" title="تمام صفحه" href="#">
                            <i class="icon-size-fullscreen"></i>
                        </a>
                        <a class="btn btn-sm btn-default btn-round btn-collapse" rel="tooltip" title="کوچک کردن" href="#">
                            <i class="icon-arrow-up"></i>
                        </a>
                    </div><!-- /.buttons-box -->
                </div><!-- /.portlet-heading -->
        <form method="POST" action="">
        {% csrf_token %}
                    <div class="portlet-body">
                            <div class="form-body">
                                <div class="form-group">
                                    <label class="col-sm-3">عنوان کلاس</label>
                                    <div class="col-sm-9">
                                        <input type="text" class="form-control" name="title" id="title" required 
                                        value="{{data.title}}">
                                    </div>
                                </div><!-- /.form-group -->
                                <div class="form-group">
                                    <label class="col-sm-3">دوره</label>
                                    <select class="form-control select2" name="course_id" required>
                                        {% for crs in course %}
                                            <option value= "{{crs.courseid}}"
                                            {% if data.courseid == crs.courseid %} selected {% endif %}>
                                            {{crs.coursecaption}}</option>
                                        {% endfor %}
                                    </select>
                                </div><!-- /.form-group -->
                                <div class="form-group">
                                    <label>سطح</label>
                                    <select class="form-control select2" name="level_id" required>
                                        {% for lvl in level %}
                                            <option value="{{lvl.levelid}}"
                                            {% if data.levelid == lvl.levelid %} selected {% endif %}>
                                            {{lvl.leveltitle}}</option>
                                        {% endfor %}
                                    </select>
                                </div><!-- /.form-group -->
                                <div class="form-group">
                                    <label>جنسیت</label>
                                    <select class="form-control select2" name="gender" required>
                                        <option value="دخترانه"
                                        {% if data.gender == 1 %} selected {% endif %}> دخترانه</option>
                                        <option value="پسرانه"
                                        {% if data.gender == 2 %} selected {% endif %}> پسرانه</option>
                                    </select>
                                </div><!-- /.form-group -->
                                <div class="form-group row">
                                    <label class="col-sm-3">روز و ساعت کلاس</label>
                                    <div class="col-sm-9">
                                        <input type="text" class="form-control" name="type" id="type" required
                                        value="{{data.type}}">
                                    </div>
                                </div>
                                <div class="form-group row">
                                    <label class="col-sm-3">تاریخ شروع</label>
                                    <div class="col-sm-9">
                                        <input type="text" class="form-control" name="start" id="start" required
                                        value="{{data.start}}">
                                    </div>
                                </div>
                                <div class="form-group row">
                                    <label class="col-sm-3">تاریخ پایان</label>
                                    <div class="col-sm-9">
                                        <input type="text" class="form-control" name="end" id="end" required
                                        value="{{data.end}}">
                                    </div>
                                </div>

                                <div class="form-actions">
                                    <button type="submit" class="btn btn-info btn-round">
                                        <i class="icon-check"></i>
                                        ذخیره
                                    </button>
                                        <a href="{% url "classlist" %}" class="btn btn-primary btn-warning round">
                                            <i class="icon-close"></i>
                                            بازگشت
                                        </a>
                                </div>
                            </div><!-- /.form-body -->
                    </div><!-- /.portlet-body -->
        </form>              

{%endblock%}

{% block scripts %}
{% comment %} <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script> {% endcomment %}
<script src="{% static 'assets/plugins/bootstrap/dist/js/bootstrap.min.js' %}"></script>
<script src="{% static 'assets/plugins/select2/dist/js/select2.full.min.js' %}"></script>
<script src="{% static 'assets/plugins/select2/dist/js/i18n/fa.js' %}"></script>
{% comment %} <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0/dist/js/select2.min.js"></script> {% endcomment %}

<script>
$(function () {

    /* -------------------------------
       1) Initialize Select2
    --------------------------------*/
    $('.select2').select2({
        width: '100%',
        dir: "rtl",
        minimumResultsForSearch: 0
    });


});
</script>
{% endblock %}
