{%extends "layout2.html" %}
{%load static%}

{%block extra_css%}
<link href="{% static "assets/plugins/select2/dist/css/select2.min.css"%}" rel="stylesheet">
{%endblock%}

{%block content%}
    <div class="row">                    
        <!-- BEGIN BREADCRUMB -->
        <div class="col-md-12">
            <div class="breadcrumb-box border shadow"> 
                <ul class="breadcrumb">
                    <li><a href="dashboard.html">زبان آموز</a></li>                              
                    <li class="active">تعریف برنامه هفتگی</li>                            
                </ul>
            </div><!-- /.breadcrumb-box -->
        </div><!-- /.col-md-12 -->
        <!-- END BREADCRUMB -->                    
        
        <div class="col-md-12">
            <div class="portlet box border shadow">
                <div class="portlet-heading">
                    <div class="portlet-title">
                        <h3 class="title">                                        
                            <i class="icon-settings"></i>
                            فرم برنامه هفتگی
                        </h3>
                    </div><!-- /.portlet-title -->
                    <div class="buttons-box">
                        <a class="btn btn-sm btn-default btn-round btn-fullscreen" rel="tooltip" title="تمام صفحه" href="#">
                            <i class="icon-size-fullscreen"></i>
                        </a>
                        <a class="btn btn-sm btn-default btn-round btn-collapse" rel="tooltip" title="کوچک کردن" href="#">
                            <i class="icon-arrow-up"></i>
                        </a>
                    </div><!-- /.buttons-box -->
                </div><!-- /.portlet-heading -->
        <form method="POST" action="">
        {% csrf_token %}
            <div class="portlet-body">
                    <div class="form-body">
                        <div class="col-xs-6">
                            <div class="form-group">
                                <label>دوره</label>
                                <select class="form-control select2" name="course_id" required>
                                    {% for crs in course %}
                                        <option value= "{{crs.courseid}}"
                                        {% if crs.courseid == old.course %}checked{% endif %}>
                                        {{crs.coursecaption}}</option>
                                    {% endfor %}
                                </select>
                            </div><!-- /.form-group -->
                            <div class="form-group">
                                <label>سطح</label>
                                <select class="form-control select2" name="level_id" required>
                                    {% for lvl in level %}
                                        <option value="{{lvl.levelid}}"
                                        {% if lvl.levelid == old.level %}checked{% endif %}>
                                        {{lvl.leveltitle}}</option>
                                    {% endfor %}
                                </select>
                            </div><!-- /.form-group -->
                            <div class="form-group">
                                <label>کلاس</label>
                                <select class="form-control select2" name="class_id" required>
                                    {% for cl in class %}
                                        <option value= "{{cl.clasessid}}"
                                        {% if cl.classid == old.class %}checked{% endif %}>
                                        {{cl.clasesstitle}}</option>
                                    {% endfor %}
                                </select>
                            </div><!-- /.form-group -->
                            <div class="form-group row">
                                <label class="col-sm-3">تاریخ شروع برنامه :</label>
                                <div class="col-sm-9">
                                    <input type="text" class="form-control" name="start" id="cardnustartber" required
                                    value="{{old.start}}">
                                </div>
                            </div>
                            <div class="form-group row">
                                <label class="col-sm-3">تاریخ پایان برنامه</label>
                                <div class="col-sm-9">
                                    <input type="text" class="form-control" name="end" id="end" required 
                                    value= "{{old.end}}">
                                </div>
                            </div>
                        </div>
                        <div class="col-xs-6">
                            <div class="form-group row">
                                <label class="col-sm-3">شنبه</label>
                                <div class="col-sm-9">
                                    <input type="text" class="form-control" name="shanbe" id="shanbe" required
                                    value= "{{old.day1}}">
                                </div>
                            </div>
                            <div class="form-group row">
                                <label class="col-sm-3">یکشنبه</label>
                                <div class="col-sm-9">
                                    <input type="text" class="form-control" name="yekshanbe" id="yekshanbe" required
                                    value= "{{old.day2}}">
                                </div>
                            </div>
                            <div class="form-group row">
                                <label class="col-sm-3">دوشنبه</label>
                                <div class="col-sm-9">
                                    <input type="text" class="form-control" name="doshanbe" id="doshanbe" required
                                    value= "{{old.day3}}">
                                </div>
                            </div>
                            <div class="form-group row">
                                <label class="col-sm-3">سه شنبه</label>
                                <div class="col-sm-9">
                                    <input type="text" class="form-control" name="seshanbe" id="seshanbe" required
                                    value= "{{old.day4}}">
                                </div>
                            </div>
                            <div class="form-group row">
                                <label class="col-sm-3">چهارشنبه</label>
                                <div class="col-sm-9">
                                    <input type="text" class="form-control" name="charshanbe" id="charshanbe" required
                                    value= "{{old.day5}}">
                                </div>
                            </div>
                            <div class="form-group row">
                                <label class="col-sm-3">پنج شنبه</label>
                                <div class="col-sm-9">
                                    <input type="text" class="form-control" name="panjshanbe" id="panjshanbe" required
                                    value= "{{old.day6}}">
                                </div>
                            </div>
                            <div class="form-group row">
                                <label class="col-sm-3">جمعه</label>
                                <div class="col-sm-9">
                                    <input type="text" class="form-control" name="jome" id="jome" required
                                    value= "{{old.day7}}">
                                </div>
                            </div>
                        </div>
                        <div class="form-actions">
                            <button type="submit" class="btn btn-info btn-round">
                                <i class="icon-check"></i>
                                ذخیره
                            </button>
                            <a href="{% url "calenderlist" %}" class="btn btn-primary btn-warning round">
                                <i class="icon-close"></i>
                                بازگشت
                            </a>
                        </div>
                    </div><!-- /.form-body -->
            </div><!-- /.portlet-body -->
        </form>        
    </div><!-- /.row -->
{%endblock%}

{% block scripts %}
{% comment %} <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script> {% endcomment %}
<script src="{% static 'assets/plugins/bootstrap/dist/js/bootstrap.min.js' %}"></script>
<script src="{% static 'assets/plugins/select2/dist/js/select2.full.min.js' %}"></script>
<script src="{% static 'assets/plugins/select2/dist/js/i18n/fa.js' %}"></script>
{% comment %} <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0/dist/js/select2.min.js"></script> {% endcomment %}

<script>
$(function () {

    $('.select2').select2({
        width: '100%',
        dir: "rtl",
        minimumResultsForSearch: 0
    });

});
function updateTotal() {
    // Read values safely (convert empty or invalid to 0)
    const oral  = parseInt($("#oral").val())  || 0;
    const quiz  = parseInt($("#quiz").val())  || 0;
    const cls   = parseInt($("#class").val()) || 0;
    const final = parseInt($("#final").val()) || 0;

    const total = oral + quiz + cls + final;

    $("#total").val(total);
}

// Trigger on typing or changing
$("#oral, #quiz, #class, #final").on("input", updateTotal);

$("#total").on("input", function () {
    updateTotal();  // Immediately correct the value
});

// Safety: recalc before submit
$("form").on("submit", updateTotal);
</script>

{% endblock %}
