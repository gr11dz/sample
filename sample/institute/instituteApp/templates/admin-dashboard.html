{%extends "layout2.html"%}
{%load static%}

{%block extra_css%}
<link href="{% static "assets/plugins/select2/dist/css/select2.min.css"%}" rel="stylesheet">
{%endblock%}


{%block content%}
<div class="row">                    
    <!-- BEGIN BREADCRUMB -->
    <div class="col-md-12">
        <div class="breadcrumb-box border shadow"> 
            <ul class="breadcrumb">
                <li><a href="{% url "admindashboard" %}">پیشخوان</a></li>                         
            </ul>
        </div><!-- /.breadcrumb-box -->
    </div><!-- /.col-md-12 -->
    <!-- END BREADCRUMB -->                    
    
    <div class="col-md-12">
        <div class="portlet box border shadow">
            <div class="portlet-heading">
                <div class="buttons-box">
                    <a class="btn btn-sm btn-default btn-round btn-collapse" rel="tooltip" title="کوچک کردن" href="#">
                        <i class="icon-arrow-up"></i>
                    </a>
                </div><!-- /.buttons-box -->
            </div><!-- /.portlet-heading -->
            <div class="portlet-body">
                <div class="row">
                    <div class="col-md-6">
                        <div class="portlet box border shadow">
                            <div class="portlet-body">
                                <p>انتخاب زبان آموز:</p>
                                <form method="POST">
                                    {% csrf_token %}
                                    <div class="form-body">
                                        <div class="input-group">
                                            <select class="form-control select2" name="student_id">
                                                <option value="" disabled selected>انتخاب زبان آموز</option>
                                               {%for s in students%}
                                                    <option value="{{ s.studentid }}">{{s.studentname}} {{s.studentfamily}}</option>
                                               {%endfor%}
                                            </select>
                                            <span class="input-group-btn">
                                                <button class="btn btn-primary" type="button" id="loadStudentInfo" dir="rtl">
                                                    دریافت اطلاعات زبان آموز
                                                </button>
                                            </span>
                                        </div><!-- ./input-group -->
                                    </div><!-- /.form-body -->
                                </form>
                            </div><!-- /.portlet-body -->
                        </div><!-- /.portlet -->
                    <div>
                </div><!-- /.row -->
            </div><!-- /.portlet-body -->
        </div><!-- /.portlet -->
    </div><!-- /.col-md-12 -->                
</div><!-- /.row -->





{%endblock%}
{% block scripts %}

{% comment %} <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script> {% endcomment %}
<script src="{% static 'assets/plugins/bootstrap/dist/js/bootstrap.min.js' %}"></script>
<script src="{% static 'assets/plugins/select2/dist/js/select2.full.min.js' %}"></script>
<script src="{% static 'assets/plugins/select2/dist/js/i18n/fa.js' %}"></script>
{% comment %} <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0/dist/js/select2.min.js"></script> {% endcomment %}

{% comment %} <script>
window.addEventListener('load', function() {
    $('.select2').select2({
        minimumResultsForSearch: 0
    });
});
</script> {% endcomment %}

<script>
    $(function () {
        $('.select2').select2({
            width: '100%',
            dir: "rtl",
            minimumResultsForSearch: 0
        });
    });
</script>
<script>
$("#loadStudentInfo").on("click", function () {
    let student_id = $("select[name='student_id']").val();

    $.ajax({
        url: "{% url 'studentinfo' %}",
        type: "POST",
        data: {
            student_id: student_id,
            csrfmiddlewaretoken: "{{ csrf_token }}"
        },
        success: function (response) {
            if (!response.trim()) {
                Swal.fire("خطا", "لطفاً یک زبان‌آموز انتخاب کنید", "error");
                return;
            }
            $("#studentModalBody").html(response);
            $("#studentModal").modal("show");
        }
    });
});
</script>


{% endblock %}
